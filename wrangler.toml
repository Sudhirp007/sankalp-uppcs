name = "sankalp-uppcs"
main = "src/server/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
FIREBASE_PROJECT_ID = "sankalp-uppcs-app"
APP_ENV = "production"
